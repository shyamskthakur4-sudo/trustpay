name: Add CDM withdrawal option
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-cdm.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch withdrawal UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.tsx')
          s=p.read_text()
          old="const[method,setMethod]=useState<'UPI'|'IMPS'>('UPI')"
          new="const[method,setMethod]=useState<'UPI'|'IMPS'|'CDM'>('UPI');const[cdmBank,setCdmBank]=useState('');const[cdmAccount,setCdmAccount]=useState('');const[cdmIfsc,setCdmIfsc]=useState('');const[cdmHolder,setCdmHolder]=useState('')"
          if old in s and "cdmBank" not in s:
              s=s.replace(old,new,1)
          old="{(['UPI','IMPS'] as const).map(x=>"
          new="{(['UPI','IMPS','CDM'] as const).map(x=>"
          s=s.replace(old,new,1)
          old="{method==='IMPS'&&<label className=\"field\">IFSC CODE<input placeholder=\"IFSC\"/></label>}"
          new="{method==='IMPS'&&<label className=\"field\">IFSC CODE<input placeholder=\"IFSC\"/></label>}{method==='CDM'&&<div className=\"cdmFields\"><div className=\"cdmIntro\"><Banknote size={17}/><span><b>Cash Deposit Machine</b><small>Enter the bank account details where the INR payout should be credited.</small></span></div><label className=\"field\">ACCOUNT HOLDER NAME<input value={cdmHolder} onChange={e=>setCdmHolder(e.target.value)} placeholder=\"Full name as per bank account\"/></label><label className=\"field\">BANK NAME<input value={cdmBank} onChange={e=>setCdmBank(e.target.value)} placeholder=\"Bank name\"/></label><label className=\"field\">BANK ACCOUNT NUMBER<input value={cdmAccount} onChange={e=>setCdmAccount(e.target.value.replace(/\\D/g,''))} inputMode=\"numeric\" placeholder=\"Account number\"/></label><label className=\"field\">IFSC CODE<input value={cdmIfsc} onChange={e=>setCdmIfsc(e.target.value.toUpperCase())} placeholder=\"IFSC code\"/></label></div>}"
          if "Banknote" not in s:
              s=s.replace(old,new,1)
          old="<button disabled={Number(amount)<MIN} onClick={()=>{setScreen('orders');notify('Withdrawal queued for review')}}>Request withdrawal <ArrowRight/></button>"
          new="<button disabled={Number(amount)<MIN||(method==='CDM'&&(!cdmHolder.trim()||!cdmBank.trim()||!cdmAccount.trim()||!cdmIfsc.trim()))} onClick={()=>{setScreen('orders');notify('Withdrawal queued for review')}}>Request withdrawal <ArrowRight/></button>"
          s=s.replace(old,new,1)
          old="ArrowLeft,ArrowRight,Check,CheckCircle2,Clock3,Copy,FileCheck2,KeyRound,LockKeyhole,Menu,RefreshCw,ShieldCheck,Smartphone,Upload,UserRound,WalletCards,XCircle"
          new="ArrowLeft,ArrowRight,Banknote,Check,CheckCircle2,Clock3,Copy,FileCheck2,KeyRound,LockKeyhole,Menu,RefreshCw,ShieldCheck,Smartphone,Upload,UserRound,WalletCards,XCircle"
          s=s.replace(old,new,1)
          p.write_text(s)
          
          p=Path('src/styles.css')
          s=p.read_text()
          s += '\n.cdmFields{margin-top:4px;padding:15px;border:1px solid #26384f;border-radius:18px;background:linear-gradient(145deg,#0e1b2a,#09121d)}.cdmIntro{display:flex;align-items:flex-start;gap:10px;padding:2px 2px 5px;color:#d7bb70}.cdmIntro span{display:block}.cdmIntro b,.cdmIntro small{display:block}.cdmIntro b{font-size:11px;color:#e8edf5}.cdmIntro small{font-size:9px;color:#71839a;line-height:1.5;margin-top:3px}.tabs{grid-template-columns:repeat(3,1fr)}@media(max-width:380px){.tabs{gap:5px}.tabs button{font-size:11px;padding:13px 7px}}\n'
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.tsx src/styles.css .github/workflows/patch-cdm.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Add CDM bank details to INR withdrawal'
          git push
      - name: Remove one-time patch workflow
        if: success()
        run: |
          git rm .github/workflows/patch-cdm.yml
          git commit -m 'Remove one-time CDM patch workflow'
          git push
