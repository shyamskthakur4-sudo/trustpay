name: Apply TrustPay UI fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main.tsx
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main.tsx')
          s=p.read_text()
          s=s.replace("const goHome=()=>{setMenu(false);setScreen('welcome')};", "const goHome=()=>{setMenu(false);setScreen(localStorage.getItem('trustpay_wallet_created')==='1'?'home':'welcome')};")
          s=s.replace("<button onClick={()=>{setScreen('adminLogin');setMenu(false)}}><FileCheck2/>Admin sign-in</button>", "")
          p.write_text(s)
          PY
      - name: Commit UI fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix wallet logo navigation and remove admin login"
          git push
